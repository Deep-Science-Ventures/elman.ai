<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Redirecting to the Elman thesis</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- /mission/ moved to /thesis/. GitHub Pages serves static files only, so
     there is no server-side 301 available here: a meta refresh plus a
     rel=canonical is the strongest redirect this host can express, and Google
     treats that pair as a permanent redirect. Do NOT add <meta robots
     noindex> to this stub — a noindexed page cannot pass the redirect signal
     on to /thesis/, which is the whole point of keeping this file. -->

<meta http-equiv="refresh" content="0; url=/thesis/">
<link rel="canonical" href="https://elman.ai/thesis/">

<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="stylesheet" href="/assets/blog.css">
<script>location.replace('/thesis/');</script>
</head>
<body>
<article class="post">
  <p class="eyebrow">Moved</p>
  <p>Our thesis now lives at <a href="/thesis/">elman.ai/thesis</a>.</p>
</article>
</body>
</html>
