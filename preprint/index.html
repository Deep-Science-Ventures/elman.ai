<!-- Short link to the bioRxiv preprint from the Allen Institute collaboration.
     Exists because a bare bioRxiv DOI URL is long and unreadable wherever a
     raw URL is displayed: Hacker News comments, email signatures, decks.

     noindex, and kept out of sitemap.xml: the canonical home of this work is
     bioRxiv, not us, so this stub has nothing to rank and should not compete.
     rel=canonical points at bioRxiv for the same reason. Meta refresh plus JS
     because GitHub Pages serves static files only and cannot issue a 301.

     If the paper is accepted and gets a journal DOI, repoint this file rather
     than asking everyone to update their links. -->

<meta http-equiv="refresh" content="0; url=https://www.biorxiv.org/content/10.64898/2026.07.01.734821v1">
