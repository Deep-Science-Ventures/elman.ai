<!-- Short link for the Hacker News "Who is hiring" thread. HN comments accept
     neither markdown nor HTML, so a bare URL is displayed in full and a long
     tagged one wraps badly. This stub keeps the posted link short and still
     carries the campaign tag, which the careers page then passes through to
     the Workable apply buttons.

     Unlike /mission/, this one IS noindex: it is a posting convenience, not a
     moved page, and it has no ranking to pass on. Keep it out of sitemap.xml.
     Same meta-refresh + JS pattern as /mission/ because GitHub Pages serves
     static files only and cannot issue a real 301.

     Channel links: Strategy/recruitment/ai-lead/application_links.md -->

<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="0; url=/careers/cto/?utm_source=hackernews&amp;utm_medium=forum&amp;utm_campaign=cto_2026">
<link rel="canonical" href="https://elman.ai/careers/cto/">

<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="stylesheet" href="/assets/blog.css">
<script>location.replace('/careers/cto/?utm_source=hackernews&utm_medium=forum&utm_campaign=cto_2026');</script>
</head>

</article>
</body>
