<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family:'BWGradualMedium'; src:url('../fonts/BwGradual-Medium.otf') format('opentype'); }
@font-face { font-family:'BWGradualRegular'; src:url('../fonts/BwGradual-Regular.otf') format('opentype'); }
@font-face { font-family:'InterMedium'; src:url('../fonts/Inter-Medium.ttf') format('truetype'); }
@font-face { font-family:'InterLight'; src:url('../fonts/Inter-Light.ttf') format('truetype'); }

:root{
  --brand-black:#1D1D1D; --brand-orange:#F76233; --orange-deep:#D74D12;
  --slate:#666F8D; --white-warm:#F4F4EF; --white-pure:#FEFEFF; --cream:#E5E5D9;
  --disp:'BWGradualMedium',sans-serif; --med:'InterMedium',sans-serif; --light:'InterLight',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1200px;height:630px;}
body{
  background:var(--white-warm); color:var(--brand-black);
  font-family:var(--light);
  padding:64px 70px;
  display:flex; flex-direction:column; justify-content:space-between;
}
.wm{height:38px;width:auto;fill:var(--brand-black);display:block;}
.eyebrow{font-family:var(--med);font-size:16px;letter-spacing:.22em;text-transform:uppercase;color:var(--brand-orange);margin-bottom:18px;}
h1{font-family:var(--disp);font-size:74px;line-height:1.02;letter-spacing:-.02em;}
h1 em{font-style:normal;color:var(--brand-orange);}
.sub{font-size:24px;line-height:1.4;color:var(--slate);margin-top:20px;max-width:900px;}

.flow{display:flex;align-items:stretch;gap:14px;}
.step{
  flex:1 1 0; background:var(--white-pure); border:1px solid var(--cream);
  border-radius:14px; padding:20px 18px; display:flex; flex-direction:column; gap:10px;
  min-height:118px;
}
.step .num{font-family:var(--med);font-size:13px;letter-spacing:.20em;text-transform:uppercase;color:var(--slate);}
.step.frontier .num{color:var(--brand-orange);}
.step .name{font-family:var(--disp);font-size:23px;line-height:1.12;letter-spacing:-.01em;}
.conn{display:flex;align-items:center;color:var(--brand-orange);flex:0 0 auto;}
.conn svg{width:26px;height:14px;}
</style>
</head>
